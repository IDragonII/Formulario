services:
  suge-db:
    image: postgres:16
    container_name: suge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suge_encuesta}
      POSTGRES_USER: ${POSTGRES_USER:-suge_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suge_pass_2026}
    ports:
      - "5433:5432"
    volumes:
      - suge_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

volumes:
  suge_pgdata:
